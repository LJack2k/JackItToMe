# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=jackittome
mod_name=JackItToMe
mod_license=MIT
mod_version=1.0.0
mod_group_id=nl.ljack2k.jackittome
mod_authors=LJack2k
mod_description=Hover any item, press G, one of that item lands in your inventory - pulled from whatever container is open. Shift+G pulls a full stack, Ctrl+G pulls as much as fits. Also adds a button on every JEI recipe view that pulls all ingredients at once. With AE2, Refined Storage, or Integrated Dynamics installed, missing ingredients can be autocrafted: the native amount-selection popup opens for each missing-but-craftable item, pre-filled with the shortfall. Supports vanilla containers, AE2 ME networks, Refined Storage grids, and Integrated Dynamics storage terminals (with autocrafting via Integrated Crafting).

# Minecraft / NeoForge - verify these against https://projects.neoforged.net/neoforged/neoforge
# Read by the release workflows as well as the build - see .github/workflows.
mod_loaders=neoforge
java_version=25

minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.97
neo_version_range=[26.1.2,)
loader_version_range=[11,)

# Parchment mappings are not published for 26.1 - see neoforge/build.gradle.

# Dependency versions — verify each at the vendor's maven before building.
# We pull all three via CurseMaven now (single source, no maven coordinate guessing).
# CurseMaven file IDs come from each mod's CurseForge file page → "Curse Maven Snippet".
# Update both the human-readable version AND the corresponding file id when bumping.

# 19.44+ also satisfies Sophisticated Storage's dev-runtime minimum (>= 19.32.0.359).
jei_version=29.29.0.80
jei_curse_file_id=8731669

ae2_version=26.1.10-beta
ae2_curse_file_id=8257570
# guideme is a transitive of AE2 (in-game documentation library by the AE2 team).
# Bump together with AE2 whenever the AE2 minimum-guideme version changes.
guideme_curse_file_id=8204880

rs_version=3.2.1
rs_curse_file_id=8211383

# Integrated Dynamics + Integrated Terminals (optional integration).
# We compile against the storage-terminal menu (Terminals), the network/storage
# API (Dynamics), the shared Cyclops Core base classes, and the CommonCapabilities
# ingredient API. File IDs match the versions shipped in the target modpack; bump
# via each mod's CurseForge file page → "Curse Maven Snippet".
integratedterminals_version=1.8.0
integratedterminals_curse_file_id=8726064

# Sophisticated Storage + Core — dev-runtime only (-PwithSophisticated), no
# compile-time integration; used to reproduce slot-settings issues (issue #4).
sophisticatedstorage_version=1.5.112.2123
sophisticatedstorage_curse_file_id=8687885
sophisticatedcore_version=1.4.104.2314
sophisticatedcore_curse_file_id=8705495

# Tom's Simple Storage — dev-runtime only (-PwithTomsStorage), no compile-time
# integration; compat verification for its terminal screens (issue #6).
tomsstorage_version=26.1-2.10.1
tomsstorage_curse_file_id=8501333
integrateddynamics_version=1.34.0
integrateddynamics_curse_file_id=8725901
cyclopscore_version=1.30.3
cyclopscore_curse_file_id=8725015
commoncapabilities_version=2.11.8-366
commoncapabilities_curse_file_id=8704714
# Integrated Tunnels — dev/test runtime ONLY (provides the Item Interface part
# that exposes an inventory to an ID network, so the storage terminal has
# something to show). Not a compile dependency of the integration.
integratedtunnels_version=1.10.0
integratedtunnels_curse_file_id=8725979
# Integrated Crafting — dev/test runtime ONLY (autocrafting for ID networks).
# Only needed if we test/build crafting-related integration behaviour.
integratedcrafting_version=1.5.0
integratedcrafting_curse_file_id=8726413

# REI — verify latest at https://maven.shedaniel.me/me/shedaniel/RoughlyEnoughItems-neoforge/
rei_version=26.1.819
