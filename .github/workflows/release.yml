name: Release

# Fires when you push a git tag starting with "v" - e.g. v1.0.0-mc1.21.1.
#   bump mod_version in gradle.properties to match, write the release notes,
#   commit, then:
#     git tag v1.0.0-mc1.21.1
#     git push origin v1.0.0-mc1.21.1
#
# This workflow ONLY builds the jar and creates the GitHub Release. The
# CurseForge + Modrinth uploads are separate workflows that run after this one
# completes (see publish-curseforge.yml / publish-modrinth.yml), so a single
# platform can be retried without rebuilding.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create the GitHub Release and attach the jar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Single source of truth: the MC version, Java version, mod version and
      # loader all come from gradle.properties, so this one workflow serves every
      # MC line (1.21.1, 26.1, ...). Nothing about the target version is here.
      - name: Read build properties
        id: props
        run: |
          echo "mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "java=$(grep -E '^java_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "modver=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "loaders=$(grep -E '^mod_loaders=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # The tag names the version it releases, so a mismatch means the jar and the
      # release disagree. Cheap to check here, confusing to discover afterwards.
      - name: Check the tag matches mod_version
        run: |
          EXPECTED="v${{ steps.props.outputs.modver }}-mc${{ steps.props.outputs.mc }}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties (expected $EXPECTED)."
            exit 1
          fi

      # Gate the release on the notes being present. A missing file is otherwise
      # silent: mc-publish substitutes an auto-generated commit list, and it is
      # only visible once published. Publishing is chained off this workflow, so
      # checking here covers CurseForge and Modrinth too.
      - name: Check the release notes
        run: |
          FILE="changelogs/${{ steps.props.outputs.modver }}.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing. Write the release notes before tagging."
            exit 1
          fi
          echo "OK: $FILE present."

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Create GitHub Release
        # Omitting curseforge-id/modrinth-id makes mc-publish only create the
        # GitHub Release here; the platform publishes pick up from there.
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            **/build/libs/!(*-sources).jar

          name: JackItToMe-${{ steps.props.outputs.loaders }}-${{ steps.props.outputs.mc }}-${{ steps.props.outputs.modver }}.jar
          # +<mc> build metadata keeps the version unique per MC line, which
          # Modrinth requires (e.g. 1.0.0+1.21.1 vs 1.0.0+26.1).
          version: "${{ steps.props.outputs.modver }}+${{ steps.props.outputs.mc }}"
          version-type: release

          loaders: ${{ steps.props.outputs.loaders }}
          game-versions: ${{ steps.props.outputs.mc }}
          java: ${{ steps.props.outputs.java }}

          # The notes for THIS version, written before tagging. The path comes from
          # mod_version, so every MC line ships the same note with no per-line
          # handling. This becomes the GitHub Release body, and the platform
          # publishes read the same file.
          changelog-file: changelogs/${{ steps.props.outputs.modver }}.md
