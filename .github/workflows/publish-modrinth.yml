name: Publish to Modrinth

# Same trigger model as publish-curseforge.yml — see comments there for
# why workflow_run is used instead of release:published. To retry just
# Modrinth after a failure: Actions → Publish to Modrinth → Run workflow
# → enter the tag (e.g. v1.0.0-mc1.21.1).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0-mc1.21.1)'
        required: true
        type: string

permissions:
  contents: read    # for `gh release download` and the source checkout

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Check out the TAGGED commit, so gradle.properties describes the MC line
      # being published rather than whatever the default branch holds. This is
      # what lets one workflow serve every line (1.21.1, 26.1, ...).
      - name: Checkout the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Read build properties
        id: props
        run: |
          echo "mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "java=$(grep -E '^java_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "modver=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "loaders=$(grep -E '^mod_loaders=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download jar from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.jar'
          ls -la dist

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Project ID (immutable internal ID). The slug is "jackittome";
          # using the ID means renaming the slug doesn't break the workflow.
          modrinth-id: wlqlNG8s
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: dist/*.jar

          name: JackItToMe-${{ steps.props.outputs.loaders }}-${{ steps.props.outputs.mc }}-${{ steps.props.outputs.modver }}.jar
          # +<mc> build metadata keeps the version unique per MC line, which
          # Modrinth requires (e.g. 1.0.0+1.21.1 vs 1.0.0+26.1).
          version: "${{ steps.props.outputs.modver }}+${{ steps.props.outputs.mc }}"
          version-type: release

          loaders: ${{ steps.props.outputs.loaders }}
          game-versions: ${{ steps.props.outputs.mc }}
          java: ${{ steps.props.outputs.java }}

          # Modrinth-only dependency entries — CurseForge IDs live in
          # publish-curseforge.yml. Slugs come from each mod's Modrinth URL
          # (modrinth.com/mod/<slug>).
          #
          # All three recipe viewers are OPTIONAL — the mod works with any one
          # of them (or none). JEI was required pre-0.5.0; EMI/REI added in 0.5.0.
          dependencies: |
            jei(optional){modrinth:jei}
            emi(optional){modrinth:emi}
            rei(optional){modrinth:rei}
            ae2(optional){modrinth:ae2}
            refined-storage(optional){modrinth:refined-storage}

          # The same notes the GitHub Release uses, read from the commit checked
          # out above, so every platform shows identical text.
          changelog-file: changelogs/${{ steps.props.outputs.modver }}.md
